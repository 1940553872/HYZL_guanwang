# 华云智联官网 V2.0 —— 内容与业务服务
# 默认（local）配置：内嵌 H2 文件数据库，开箱即用；生产使用 postgres profile（见 application-postgres.yml）
server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework

spring:
  application:
    name: hyzl-api
  datasource:
    url: ${DB_URL:jdbc:h2:file:${hyzl.data-dir}/hyzl;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;AUTO_SERVER=FALSE}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
  flyway:
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /api/v1/docs

hyzl:
  data-dir: ${HYZL_DATA_DIR:./data}
  seed:
    # auto：种子文件变化时重新导入内容（当前版本内容由种子维护）；never：不导入
    mode: ${HYZL_SEED_MODE:auto}
  cors:
    allowed-origins: ${HYZL_CORS_ORIGINS:http://localhost:3000}
  admin:
    # 后台接口令牌；为空时后台接口关闭。生产环境请改用 SSO（K-05 §5）
    token: ${HYZL_ADMIN_TOKEN:}
  crypto:
    # 本地开发默认密钥（仅用于演示）；生产必须通过环境变量注入，并由 KMS 托管
    sm4-key: ${HYZL_SM4_KEY:aHl6bC1sb2NhbC1zbTQhIQ==}
    hmac-key: ${HYZL_HMAC_KEY:hyzl-local-hmac-key-change-me}
  consent-version: ${HYZL_CONSENT_VERSION:2026-10}
  rum:
    sample-rate: ${HYZL_RUM_SAMPLE:0.2}
